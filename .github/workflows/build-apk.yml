name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: "Bake DEBUG_MODE=True into the APK"
        type: boolean
        default: false
  release:
    types: [published, prereleased]

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Android APK Builder
        run: |
          DEBUG_FLAG=""
          if [ "${{ github.event.inputs.debug_mode }}" = "true" ]; then
            DEBUG_FLAG="--debug"
          fi
          python redu-dev/build_mobile_apk.py $DEBUG_FLAG

      - name: Locate and inspect APK output
        run: |
          ls -lh build/apk/

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sloverb-studio-android-apk
          path: build/apk/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
