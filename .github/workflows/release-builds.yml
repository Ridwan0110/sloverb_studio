name: Release Builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86-64
          - target: win-x86-64
            runner: windows-latest
            os_name: windows
            arch: x86_64

          # Linux x86-64
          - target: linux-x86-64
            runner: ubuntu-latest
            os_name: linux
            arch: x86_64

          # macOS ARM64 (Apple Silicon)
          - target: darwin-arm
            runner: macos-latest
            os_name: darwin
            arch: arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2-dev libgtk-3-0 libmpv2 ffmpeg

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio ffmpeg-full
          brew link --overwrite --force ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> $GITHUB_PATH

      - name: Set up FFmpeg (Windows)
        if: runner.os == 'Windows'
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Universal Binary Builder
        run: |
          python redu-dev/build_binary.py --clean

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sloverb-studio-${{ matrix.target }}
          path: dist/archives/*
          if-no-files-found: error

      - name: Attach Archives to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/archives/*
          prerelease: auto
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
