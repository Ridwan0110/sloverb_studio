name: CI

on:
  push:
    branches:
      - redu-dev
  pull_request:
    branches:
      - redu-dev

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system audio dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libasound2-dev

      - name: Install system audio dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install portaudio || true

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify FFmpeg installation
        run: ffmpeg -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python requirements.py --install

      - name: Verify dependencies
        run: python requirements.py --check

      - name: Run PyTest test suite
        run: python -m pytest -v
